<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paket Hosting - PTEROVOLKAZE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg-white: #ffffff;
            --bg-gray: #f8fafc;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --border: #e2e8f0;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --shadow: rgba(0,0,0,0.1);
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --bg-white: #1e293b;
            --bg-gray: #0f172a;
            --text-dark: #f1f5f9;
            --text-gray: #94a3b8;
            --border: #334155;
            --card-bg: #1e293b;
            --header-bg: #0f172a;
            --shadow: rgba(0,0,0,0.3);
        }

        [data-color="blue"] { --primary: #2563eb; --primary-dark: #1e40af; }
        [data-color="red"] { --primary: #dc2626; --primary-dark: #b91c1c; }
        [data-color="green"] { --primary: #16a34a; --primary-dark: #15803d; }
        [data-color="purple"] { --primary: #7c3aed; --primary-dark: #6d28d9; }
        [data-color="orange"] { --primary: #ea580c; --primary-dark: #c2410c; }
        [data-color="pink"] { --primary: #db2777; --primary-dark: #be185d; }
        [data-color="teal"] { --primary: #0d9488; --primary-dark: #0f766e; }
        [data-color="yellow"] { --primary: #ca8a04; --primary-dark: #a16207; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        body {
            background: var(--bg-gray);
            min-height: 100vh;
            padding-bottom: 70px;
            padding-top: 70px;
        }

        .top-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .header-logo {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            object-fit: cover;
        }

        .header-brand-text { font-size: 1.2em; font-weight: 700; color: var(--text-dark); }
        .header-brand-text span { color: var(--primary); }

        .hamburger-btn {
            background: none;
            border: none;
            color: var(--text-dark);
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1001;
            display: none;
        }

        .sidebar-overlay.active { display: block; }

        .sidebar {
            position: fixed;
            top: 0;
            right: -300px;
            width: 280px;
            height: 100vh;
            background: var(--header-bg);
            border-left: 1px solid var(--border);
            z-index: 1002;
            transition: right 0.3s ease;
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar.active { right: 0; }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .sidebar-title { font-size: 1.2em; font-weight: 700; color: var(--text-dark); }
        .close-sidebar { background: none; border: none; color: var(--text-gray); font-size: 1.5em; cursor: pointer; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { margin-bottom: 10px; }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            color: var(--text-dark);
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 0.9em;
            font-weight: 500;
        }

        .sidebar-menu a:hover { background: var(--bg-gray); color: var(--primary); }
        .sidebar-menu a.active { background: var(--primary); color: white; }
        .sidebar-menu i { width: 20px; text-align: center; }

        .theme-toggle {
            margin-top: 20px;
            padding: 15px;
            background: var(--bg-gray);
            border-radius: 10px;
        }

        .theme-toggle label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.9em;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background: var(--border);
            border-radius: 13px;
            transition: all 0.3s;
        }

        .toggle-switch::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: white;
            top: 3px;
            left: 3px;
            transition: all 0.3s;
        }

        .theme-toggle input { display: none; }
        .theme-toggle input:checked + .toggle-switch { background: var(--primary); }
        .theme-toggle input:checked + .toggle-switch::before { transform: translateX(24px); }

        .color-picker {
            margin-top: 20px;
            padding: 15px;
            background: var(--bg-gray);
            border-radius: 10px;
        }

        .color-picker-label {
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }

        .color-option:hover { transform: scale(1.2); }
        .color-option.active { border-color: var(--text-dark); box-shadow: 0 0 10px rgba(0,0,0,0.3); }

        .color-blue { background: #2563eb; }
        .color-red { background: #dc2626; }
        .color-green { background: #16a34a; }
        .color-purple { background: #7c3aed; }
        .color-orange { background: #ea580c; }
        .color-pink { background: #db2777; }
        .color-teal { background: #0d9488; }
        .color-yellow { background: #ca8a04; }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .page-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-title h2 { color: var(--text-dark); font-size: 1.5em; margin-bottom: 5px; }
        .page-title h2 span { color: var(--primary); }
        .page-title p { color: var(--text-gray); font-size: 0.9em; }

        .packages-grid {
            display: grid;
            gap: 15px;
        }

        .package-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            transition: all 0.3s;
            position: relative;
        }

        .package-card:hover {
            box-shadow: 0 5px 20px var(--shadow);
            transform: translateY(-2px);
        }

        .package-card.popular { border: 2px solid var(--primary); }

        .popular-badge {
            position: absolute;
            top: -10px;
            right: 15px;
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7em;
            font-weight: 600;
        }

        .package-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .package-name { font-size: 1.1em; font-weight: 700; color: var(--text-dark); }
        .package-price { font-size: 1.3em; font-weight: 700; color: var(--primary); }

        .package-specs { list-style: none; margin-bottom: 15px; }

        .package-specs li {
            padding: 6px 0;
            color: var(--text-gray);
            font-size: 0.85em;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }

        .package-specs li:last-child { border-bottom: none; }
        .package-specs i { color: var(--primary); width: 16px; text-align: center; }

        .buy-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .buy-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--header-bg);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            text-decoration: none;
            color: var(--text-gray);
            font-size: 0.75em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: color 0.3s;
            padding: 5px 15px;
        }

        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--primary); }

        .whatsapp-float {
            position: fixed;
            bottom: 80px;
            right: 20px;
            background: #25d366;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.4);
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="top-header">
        <a href="index.html" class="header-brand">
            <img src="hamzt.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
            <span class="header-brand-text">PTERO<span>VOLKAZE</span></span>
        </a>
        <button class="hamburger-btn" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Menu</span>
            <button class="close-sidebar" onclick="toggleSidebar()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="paket.html" class="active"><i class="fas fa-box"></i> Pilihan Paket</a></li>
            <li><a href="dashboard.html"><i class="fas fa-server"></i> Panel Saya</a></li>
            <li><a href="dashboard.html#history"><i class="fas fa-history"></i> Riwayat Transaksi</a></li>
            <li><a href="about.html"><i class="fas fa-info-circle"></i> Tentang Kami</a></li>
        </ul>
        
        <div class="theme-toggle">
            <label>
                <span><i class="fas fa-moon"></i> Dark Mode</span>
                <input type="checkbox" id="themeToggle" onchange="toggleTheme()">
                <span class="toggle-switch"></span>
            </label>
        </div>

        <div class="color-picker">
            <div class="color-picker-label">
                <i class="fas fa-palette"></i> Pilih Warna
            </div>
            <div class="color-options">
                <div class="color-option color-blue active" onclick="changeColor('blue')"></div>
                <div class="color-option color-red" onclick="changeColor('red')"></div>
                <div class="color-option color-green" onclick="changeColor('green')"></div>
                <div class="color-option color-purple" onclick="changeColor('purple')"></div>
                <div class="color-option color-orange" onclick="changeColor('orange')"></div>
                <div class="color-option color-pink" onclick="changeColor('pink')"></div>
                <div class="color-option color-teal" onclick="changeColor('teal')"></div>
                <div class="color-option color-yellow" onclick="changeColor('yellow')"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="page-title">
            <h2>PTERO<span>VOLKAZE</span></h2>
            <p>Pilih paket hosting sesuai kebutuhan Anda</p>
        </div>

        <div class="packages-grid" id="packagesGrid"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="paket.html" class="nav-item active"><i class="fas fa-box"></i><span>Paket</span></a>
        <a href="dashboard.html" class="nav-item"><i class="fas fa-history"></i><span>Riwayat</span></a>
        <a href="https://wa.me/628568122701" class="nav-item" target="_blank"><i class="fas fa-headset"></i><span>Bantuan</span></a>
    </nav>

    <a href="https://wa.me/628568122701" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="config.js"></script>
    <script>
        function initTheme() {
            const savedTheme = localStorage.getItem('pterovolkaze_theme') || 'light';
            const savedColor = localStorage.getItem('pterovolkaze_color') || 'blue';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.documentElement.setAttribute('data-color', savedColor);
            const themeToggle = document.getElementById('themeToggle');
            if (themeToggle) themeToggle.checked = savedTheme === 'dark';
            updateActiveColor(savedColor);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('pterovolkaze_theme', newTheme);
        }

        function changeColor(color) {
            document.documentElement.setAttribute('data-color', color);
            localStorage.setItem('pterovolkaze_color', color);
            updateActiveColor(color);
        }

        function updateActiveColor(color) {
            document.querySelectorAll('.color-option').forEach(el => el.classList.remove('active'));
            const activeColor = document.querySelector(`.color-${color}`);
            if (activeColor) activeColor.classList.add('active');
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function renderPackages() {
            const grid = document.getElementById('packagesGrid');
            grid.innerHTML = '';
            
            CONFIG.PACKAGES.forEach(pkg => {
                const card = document.createElement('div');
                card.className = 'package-card' + (pkg.popular ? ' popular' : '');
                
                card.innerHTML = `
                    ${pkg.popular ? '<div class="popular-badge">POPULER</div>' : ''}
                    <div class="package-header">
                        <span class="package-name">${pkg.name}</span>
                        <span class="package-price">Rp ${pkg.price.toLocaleString('id-ID')}</span>
                    </div>
                    <ul class="package-specs">
                        <li><i class="fas fa-memory"></i> RAM: ${pkg.ram}</li>
                        <li><i class="fas fa-hdd"></i> Disk: ${pkg.disk}</li>
                        <li><i class="fas fa-microchip"></i> CPU: ${pkg.cpu}</li>
                    </ul>
                    <button class="buy-btn" onclick="buyPackage(${pkg.id})">
                        <i class="fas fa-shopping-cart"></i> Beli Sekarang
                    </button>
                `;
                
                grid.appendChild(card);
            });
        }

        function buyPackage(packageId) {
            window.location.href = `payment.html?package=${packageId}`;
        }

        initTheme();
        renderPackages();
    </script>
</body>
</html>
